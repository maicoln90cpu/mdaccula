name: Deploy Supabase Edge Functions

# Roda sozinho toda vez que algo em supabase/functions/ muda em main.
# Usa o CLI oficial da Supabase — diferente do deployer do Lovable, ele
# empacota supabase/functions/_shared/ corretamente em qualquer função
# que importe de lá (era esse o bug que travava 9 funções).
on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Instalar o CLI da Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy de todas as Edge Functions (exceto mcp)
        # `mcp` é excluída deste passo — ver o próximo passo e docs/PENDENCIAS.md.
        run: |
          FUNCS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared ! -name mcp -exec basename {} \;)
          supabase functions deploy --project-ref xfvpuzlspvvsmmunznxw $FUNCS
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy de mcp (não bloqueia o pipeline)
        # supabase/functions/mcp/index.ts é auto-gerado por @lovable.dev/mcp-js,
        # que traz `esbuild` como dependência direta (não dev) — o bundler do
        # Deno inclui os binários nativos do esbuild no pacote final (~26MB),
        # e a API do Supabase rejeita com 413 "request entity too large".
        # Isolado num passo próprio com continue-on-error pra não derrubar o
        # deploy de TODAS as outras functions (o bug real: antes desta mudança,
        # qualquer function cujo nome venha depois de "mcp" em ordem alfabética
        # nunca era deployada). Ver docs/PENDENCIAS.md para o fix definitivo.
        run: |
          supabase functions deploy mcp --project-ref xfvpuzlspvvsmmunznxw \
            || echo "::warning::Deploy de 'mcp' falhou (bundle > tamanho máximo, causa raiz em docs/PENDENCIAS.md) — não bloqueando o restante do pipeline."
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
