name: Deploy Supabase Edge Functions

# Roda sozinho toda vez que algo em supabase/functions/ muda em main.
# Usa o CLI oficial da Supabase — diferente do deployer do Lovable, ele
# empacota supabase/functions/_shared/ corretamente em qualquer função
# que importe de lá (era esse o bug que travava 9 funções).
on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Instalar o CLI da Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy de todas as Edge Functions
        # `mcp` voltou a entrar no deploy normal: foi reescrita à mão (sem a
        # biblioteca @lovable.dev/mcp-js, que arrastava binários do esbuild e
        # gerava um bundle de ~26MB rejeitado com 413 pela API da Supabase).
        run: |
          FUNCS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared -exec basename {} \;)
          supabase functions deploy --project-ref xfvpuzlspvvsmmunznxw $FUNCS
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

